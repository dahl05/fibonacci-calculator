<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="피보나치 계산기">
  <meta name="description" content="주식 피보나치 눌림목 가격 계산기">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>피보나치 눌림목 계산기</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121d30; --line:#26354c; --muted:#9aa9bf; --text:#f4f7fb; --blue:#60a5fa; --blue2:#2563eb; --danger:#f87171; }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body { margin:0; min-height:100vh; min-height:100dvh; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); background:radial-gradient(ellipse at top, #172844 0%, var(--bg) 55%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; justify-content:center; align-items:center; }
    main { width:100%; max-width:460px; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:.13em; text-align:center; margin-bottom:10px; }
    h1 { text-align:center; font-size:27px; letter-spacing:-.04em; margin:0 0 8px; }
    .subtitle { text-align:center; color:var(--muted); font-size:14px; margin:0 0 26px; }
    .panel { background:rgba(18,29,48,.96); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:0 18px 50px #0003; }
    label { display:block; font-size:14px; color:#d7e1ef; font-weight:700; margin:0 0 9px; }
    .field { margin-bottom:18px; }
    .input-wrap { position:relative; }
    input { width:100%; min-height:58px; border-radius:13px; border:1px solid #354762; background:#0b1424; color:var(--text); padding:0 46px 0 15px; font-size:19px; font-weight:650; outline:none; -webkit-appearance:none; appearance:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #60a5fa24; }
    .won { position:absolute; right:15px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
    button { width:100%; min-height:56px; border:0; border-radius:14px; background:linear-gradient(135deg,#3b82f6,#2563eb); color:white; font-size:17px; font-weight:800; letter-spacing:-.02em; margin-top:2px; cursor:pointer; touch-action:manipulation; }
    button:active { transform:scale(.99); }
    .error { display:none; color:var(--danger); font-size:13px; line-height:1.5; margin:12px 2px 0; }
    .results { display:none; margin-top:22px; }
    .result-heading { font-size:14px; font-weight:800; margin:0 0 12px; color:#dce8f8; }
    .result { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 14px; background:#0b1424; border:1px solid var(--line); border-radius:13px; margin-top:9px; }
    .ratio { font-size:14px; color:#b7c5d8; white-space:nowrap; }
    .price { font-size:17px; font-weight:800; color:#93c5fd; text-align:right; overflow-wrap:anywhere; }
    .result.featured { border-color:#3b82f6; background:#132541; }
    .result.featured .price { color:#bfdbfe; }
    .note { font-size:12px; color:var(--muted); line-height:1.6; margin:18px 3px 0; }
    .footer { text-align:center; color:#73839a; font-size:11px; margin-top:18px; }
    @media (max-width:360px) { h1{font-size:24px}.panel{padding:17px}.price{font-size:15px} }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">STOCK TOOL · FIBONACCI</div>
  <h1>피보나치 눌림목 계산기</h1>
  <p class="subtitle">고점과 저점을 입력해 되돌림 가격대를 확인하세요.</p>
  <section class="panel" aria-label="피보나치 계산기">
    <form id="calcForm" novalidate>
      <div class="field">
        <label for="highPrice">고점 가격 (High)</label>
        <div class="input-wrap"><input id="highPrice" type="number" inputmode="decimal" step="any" min="0" placeholder="예: 70,000" autocomplete="off"><span class="won">원</span></div>
      </div>
      <div class="field">
        <label for="lowPrice">저점 가격 (Low)</label>
        <div class="input-wrap"><input id="lowPrice" type="number" inputmode="decimal" step="any" min="0" placeholder="예: 50,000" autocomplete="off"><span class="won">원</span></div>
      </div>
      <button type="submit">눌림목 가격 계산하기</button>
      <p id="errorMsg" class="error" role="alert">고점과 저점을 확인해 주세요. 고점은 저점보다 커야 합니다.</p>
    </form>
    <section id="results" class="results" aria-live="polite">
      <h2 class="result-heading">📌 피보나치 되돌림 가격대</h2>
      <div class="result"><span class="ratio">0.382 눌림목</span><span id="retrace382" class="price">—</span></div>
      <div class="result featured"><span class="ratio">0.500 눌림목</span><span id="retrace500" class="price">—</span></div>
      <div class="result"><span class="ratio">0.618 눌림목</span><span id="retrace618" class="price">—</span></div>
      <p class="note">계산값은 고점에서 고점·저점 차이의 각 비율만큼 하락한 가격입니다. 투자 판단을 위한 참고 자료이며 매매를 보장하지 않습니다.</p>
    </section>
  </section>
  <div class="footer">입력값은 외부로 전송되지 않습니다.</div>
</main>
<script>
  const form = document.getElementById('calcForm');
  const highInput = document.getElementById('highPrice');
  const lowInput = document.getElementById('lowPrice');
  const errorMsg = document.getElementById('errorMsg');
  const results = document.getElementById('results');
  const fmt = n => n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
  form.addEventListener('submit', event => {
    event.preventDefault();
    const high = Number(highInput.value);
    const low = Number(lowInput.value);
    if (highInput.value.trim() === '' || lowInput.value.trim() === '' || !Number.isFinite(high) || !Number.isFinite(low) || low < 0 || high <= low) {
      errorMsg.style.display = 'block';
      results.style.display = 'none';
      return;
    }
    errorMsg.style.display = 'none';
    const diff = high - low;
    document.getElementById('retrace382').textContent = fmt(high - diff * 0.382) + ' 원';
    document.getElementById('retrace500').textContent = fmt(high - diff * 0.5) + ' 원';
    document.getElementById('retrace618').textContent = fmt(high - diff * 0.618) + ' 원';
    results.style.display = 'block';
  });
  [highInput, lowInput].forEach(input => input.addEventListener('input', () => {
    if (results.style.display === 'block') results.style.display = 'none';
    errorMsg.style.display = 'none';
  }));
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
